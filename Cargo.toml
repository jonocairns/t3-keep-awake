[package]
name = "t3-keep-awake"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Keep Windows awake while T3 Code threads are working inside WSL."
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
