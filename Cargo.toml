[package]
name = "herdr-keep-awake"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Keep Windows awake while herdr agents are working inside WSL."
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
